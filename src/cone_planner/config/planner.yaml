delaunay_planner:
  ros__parameters:
    # Crossing-edge length band (metres). DESIGN THE TRACK to satisfy:
    #   boundary cone spacing  <  min_edge_len  <  track width  <  max_edge_len
    # e.g. spacing 0.4 m, width 0.9-1.2 m  ->  band [0.6, 1.5] separates cleanly.
    min_edge_len: 0.8
    max_edge_len: 1.5

    # Stop chaining waypoints if the next nearest one is farther than this.
    max_waypoint_gap: 0.3

    # Ignore midpoints behind (or at) the robot.
    min_forward_x: 0.0

    # Local path length cap.
    max_waypoints: 5

    publish_markers: true
