cone_detector:
  ros__parameters:
    # The cloud is transformed into this frame before processing (z = up).
    target_frame: base_link

    # Region of interest, in target_frame (metres). x: forward, y: left, z: up.
    # MUST cover the whole track: anything outside is invisible by definition.
    # Sensor now sits at the robot's front, so near-field starts close.
    # crop_max_x widened 2.5 -> 3.5: the Delaunay planner needs >=4 cones
    # simultaneously in view (see cone_planner/delaunay_planner_node.py) and
    # has no memory between frames, so a shallow ROI meant any instant with
    # too few cones in the box emptied the path. More forward depth gives
    # more margin before that happens. Now that voxel_leaf keeps clustering
    # cheap even with a bigger cropped cloud, this is close to free.
    crop_min_x: 0.2
    crop_max_x: 2.5
    crop_min_y: -1.0
    crop_max_y: 1.0
    # Stacked cans are ~24 cm tall, so crop the ground hard: everything below
    # 8 cm is deleted. This is what keeps cones from merging with the floor.
    crop_min_z: 0.08
    crop_max_z: 0.40

    # Voxel downsampling at 2 cm: smaller than any cone feature we gate on
    # (footprints run 5-15 cm), so it barely touches sparse far-cone returns,
    # but it caps the point count PCL's Euclidean clustering has to chew
    # through. Re-enabled after a real drive log showed a large object
    # (rejected by the shape gate, but still fully grown by the clusterer
    # before being thrown away -- PCL doesn't early-exit on max_cluster_size)
    # pushing cropped point count to ~8000 and clustering alone to 200-270ms,
    # long enough to blow the path_timeout and stop the robot. If this ever
    # needs revisiting: was previously disabled because it thins far cones,
    # which already get few beam hits -- watch far-cone detection range if
    # you raise this much above 0.02.
    voxel_leaf: 0.02

    # Euclidean clustering.
    # tolerance 0.12: ring-to-ring spacing on a cone reaches ~6-8 cm at range,
    # and 0.06 was splitting one cone into two clusters (one per ring). Track
    # cones are >= 30 cm apart, so 0.12 cannot merge two real cones.
    # min size 2 so far cones (few points) survive; the mapper's voting
    # handles the noise this lets through.
    # max size 5000: with the tilted front mount, a cone at 0.5 m is hit by
    # many rings and can carry hundreds of points; clusters over the max are
    # DISCARDED by PCL, so keep this generous or close cones vanish.
    cluster_tolerance: 0.12
    min_cluster_size: 2
    max_cluster_size: 3000

    # Shape gates. min_top_z is the workhorse: a cluster must REACH above
    # 14 cm to be a cone. Far cones pass (their few points sit high on the
    # can); ground leakage fails (its points sit just above the 8 cm crop).
    min_top_z: 0.14
    min_footprint: 0.0
    max_footprint: 0.20
    min_height: 0.02
    max_height: 0.30
    # Aspect gate effectively off; axis-aligned aspect is bearing-dependent
    # and was rejecting real cones. Kept as a parameter for experimentation.
    max_aspect: 10.0

    # Diagnostics: log every cluster's dimensions and show labelled boxes in
    # RViz (/debug/cluster_info). Turn off once tuned.
    diagnostic: true
    publish_debug: true

cone_mapper:
  ros__parameters:
    # Frame the persistent map lives in. base_link while the robot is static;
    # change to "odom" once wheel odometry is publishing.
    target_frame: base_link

    # A detection within this distance of an existing tracked cone is treated
    # as the same cone (running-average position update).
    association_radius: 0.20

    # A tracked cone must be detected this many times before it is confirmed
    # and appears in /cones/map. Higher = fewer false cones, slower to appear.
    min_observations: 5

    # Unconfirmed tracks unseen for this long are forgotten (transient noise).
    # Confirmed cones are never forgotten.
    forget_unconfirmed_sec: 2.0